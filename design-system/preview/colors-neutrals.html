<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .sw { border-radius:8px; padding:10px 12px; min-height:60px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--border-1);}
  .n { font-weight:600; font-size:12px; }
  .h { font-family:var(--font-mono); font-size:10px; opacity:.8;}
</style></head>
<body><div class="card">
  <div style="display:grid; grid-template-columns: repeat(8, 1fr); gap:6px;">
    <div class="sw" style="background:var(--ink-000);"><span class="n" style="color:var(--ink-900)">000</span><span class="h" style="color:var(--ink-600)">#FFFFFF</span></div>
    <div class="sw" style="background:var(--ink-050);"><span class="n" style="color:var(--ink-900)">050</span><span class="h" style="color:var(--ink-600)">#F5F7FA</span></div>
    <div class="sw" style="background:var(--ink-100);"><span class="n" style="color:var(--ink-900)">100</span><span class="h" style="color:var(--ink-600)">#EEF1F5</span></div>
    <div class="sw" style="background:var(--ink-150);"><span class="n" style="color:var(--ink-900)">150</span><span class="h" style="color:var(--ink-600)">#E6EAF0</span></div>
    <div class="sw" style="background:var(--ink-200);"><span class="n" style="color:var(--ink-900)">200</span><span class="h" style="color:var(--ink-700)">#DDE3EA</span></div>
    <div class="sw" style="background:var(--ink-300);"><span class="n" style="color:var(--ink-900)">300</span><span class="h" style="color:var(--ink-800)">#C3CAD4</span></div>
    <div class="sw" style="background:var(--ink-400); color:#fff;"><span class="n">400</span><span class="h">#9AA3B2</span></div>
    <div class="sw" style="background:var(--ink-500); color:#fff;"><span class="n">500</span><span class="h">#6B7689</span></div>
    <div class="sw" style="background:var(--ink-600); color:#fff;"><span class="n">600</span><span class="h">#4A5668</span></div>
    <div class="sw" style="background:var(--ink-700); color:#fff;"><span class="n">700</span><span class="h">#2E3A4D</span></div>
    <div class="sw" style="background:var(--ink-800); color:#fff;"><span class="n">800</span><span class="h">#1A2433</span></div>
    <div class="sw" style="background:var(--ink-900); color:#fff;"><span class="n">900</span><span class="h">#0B1320</span></div>
  </div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:14px;">
    <div style="font-size:12px; color:var(--fg-3);"><b style="color:var(--fg-1);">canvas</b><br/><span style="font-family:var(--font-mono);">#F7F9FC</span></div>
    <div style="font-size:12px; color:var(--fg-3);"><b style="color:var(--fg-1);">surface</b><br/><span style="font-family:var(--font-mono);">#FFFFFF</span></div>
    <div style="font-size:12px; color:var(--fg-3);"><b style="color:var(--fg-1);">border-1</b><br/><span style="font-family:var(--font-mono);">#E6EAF0</span></div>
    <div style="font-size:12px; color:var(--fg-3);"><b style="color:var(--fg-1);">border-2</b><br/><span style="font-family:var(--font-mono);">#DDE3EA</span></div>
  </div>
</div></body></html>
