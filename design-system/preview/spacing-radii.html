<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.r{ display:flex; flex-direction:column; align-items:center; gap:8px;} .b{width:72px; height:72px; background:var(--navy-100); border:1px solid var(--navy-700); border-color:rgba(15,42,74,.25);}</style>
</head>
<body><div class="card">
  <div style="display:flex; gap:22px; flex-wrap:wrap;">
    <div class="r"><div class="b" style="border-radius:var(--radius-xs);"></div><span class="token-label">xs · 4</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-sm);"></div><span class="token-label">sm · 6</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-md);"></div><span class="token-label">md · 8</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-lg);"></div><span class="token-label">lg · 12</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-xl);"></div><span class="token-label">xl · 16</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-2xl);"></div><span class="token-label">2xl · 24</span></div>
    <div class="r"><div class="b" style="border-radius:var(--radius-pill);"></div><span class="token-label">pill · 999</span></div>
  </div>
  <p class="meta" style="margin-top:14px;">Inputs use sm · buttons md · cards lg · modals xl · chips/avatars pill</p>
</div></body></html>
