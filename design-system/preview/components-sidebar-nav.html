<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_card.css"/>
<style>.nav{width:240px;background:var(--navy-800);padding:14px 12px;border-radius:12px;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#A9B6C7;font-family:var(--font-sans)}
.it.a{background:var(--teal-500);color:#fff;font-weight:700}
.gp{font-size:11px;font-weight:700;color:#5C6F89;padding:10px 12px 4px}
.cnt{margin-right:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.10);color:#fff;font-family:var(--font-mono);direction:ltr}
.it.a .cnt{background:rgba(255,255,255,.20)}
.dot{width:18px;height:18px;border-radius:4px;background:rgba(255,255,255,.15)}</style>
</head>
<body><div class="card" style="background:var(--bg-app);padding:20px"><div class="nav">
  <div class="gp">مساحة العمل</div>
  <div class="it"><span class="dot"></span>الرئيسية</div>
  <div class="it a"><span class="dot" style="background:rgba(255,255,255,.3)"></span>المشاريع<span class="cnt">7</span></div>
  <div class="it"><span class="dot"></span>المهام<span class="cnt">9</span></div>
  <div class="it"><span class="dot"></span>الموردون</div>
  <div class="gp">المالية</div>
  <div class="it"><span class="dot"></span>المتابعة المالية<span class="cnt">6</span></div>
  <div class="it"><span class="dot"></span>التقارير</div>
</div></div></body></html>
