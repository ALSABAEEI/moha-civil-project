<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:32px; align-items:center;">
    <div class="col" style="align-items:center; gap:10px;">
      <div style="width:96px;height:96px;background:#fff;border:1px solid var(--border-1);border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <img src="../assets/logo-icon.svg" style="width:64px;height:64px;"/>
      </div>
      <span class="meta">Color · on light</span>
    </div>
    <div class="col" style="align-items:center; gap:10px;">
      <div style="width:96px;height:96px;background:var(--navy-800);border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <img src="../assets/logo-icon.svg" style="width:64px;height:64px;"/>
      </div>
      <span class="meta">Color · on navy</span>
    </div>
    <div class="col" style="align-items:center; gap:10px;">
      <div style="width:96px;height:96px;background:#fff;border:1px solid var(--border-1);border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <img src="../assets/logo-icon-mono.svg" style="width:64px;height:64px;"/>
      </div>
      <span class="meta">Monochrome</span>
    </div>
    <div class="col" style="align-items:center; gap:10px;">
      <div style="width:96px;height:96px;background:var(--ink-900);border-radius:12px;display:flex;align-items:center;justify-content:center; filter:invert(1);">
        <img src="../assets/logo-icon-mono.svg" style="width:64px;height:64px;"/>
      </div>
      <span class="meta">Reverse</span>
    </div>
  </div>
</div></body></html>
