<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.s{ display:flex; flex-direction:column; align-items:center; gap:10px;} .e{width:96px; height:64px; background:#fff; border-radius:10px;}</style>
</head>
<body><div class="card" style="background:var(--canvas);">
  <div style="display:flex; gap:26px; justify-content:space-between; padding:14px 0;">
    <div class="s"><div class="e" style="box-shadow:var(--shadow-xs);"></div><span class="token-label">xs</span></div>
    <div class="s"><div class="e" style="box-shadow:var(--shadow-sm);"></div><span class="token-label">sm</span></div>
    <div class="s"><div class="e" style="box-shadow:var(--shadow-md);"></div><span class="token-label">md</span></div>
    <div class="s"><div class="e" style="box-shadow:var(--shadow-lg);"></div><span class="token-label">lg</span></div>
    <div class="s"><div class="e" style="box-shadow:var(--shadow-xl);"></div><span class="token-label">xl</span></div>
    <div class="s"><div class="e" style="box-shadow:var(--shadow-focus); border:1px solid var(--teal-500);"></div><span class="token-label">focus</span></div>
  </div>
</div></body></html>
