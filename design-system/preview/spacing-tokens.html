<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.row3 { display:flex; align-items:center; gap:14px; padding:4px 0;} .tok{font-family:var(--font-mono); font-size:10.5px; color:var(--fg-3); width:80px;} .bar{ background:var(--teal-500); height:14px; border-radius:3px; } .px{font-family:var(--font-mono); font-size:10.5px; color:var(--fg-3); width:36px; text-align:right;}</style>
</head>
<body><div class="card">
  <div class="row3"><span class="tok">--space-1</span><div class="bar" style="width:4px;"></div><span class="px">4</span></div>
  <div class="row3"><span class="tok">--space-2</span><div class="bar" style="width:8px;"></div><span class="px">8</span></div>
  <div class="row3"><span class="tok">--space-3</span><div class="bar" style="width:12px;"></div><span class="px">12</span></div>
  <div class="row3"><span class="tok">--space-4</span><div class="bar" style="width:16px;"></div><span class="px">16</span></div>
  <div class="row3"><span class="tok">--space-5</span><div class="bar" style="width:20px;"></div><span class="px">20</span></div>
  <div class="row3"><span class="tok">--space-6</span><div class="bar" style="width:24px;"></div><span class="px">24</span></div>
  <div class="row3"><span class="tok">--space-8</span><div class="bar" style="width:32px;"></div><span class="px">32</span></div>
  <div class="row3"><span class="tok">--space-10</span><div class="bar" style="width:40px;"></div><span class="px">40</span></div>
  <div class="row3"><span class="tok">--space-12</span><div class="bar" style="width:48px;"></div><span class="px">48</span></div>
  <div class="row3"><span class="tok">--space-16</span><div class="bar" style="width:64px;"></div><span class="px">64</span></div>
  <p class="meta" style="margin-top:10px;">4-px base · use 8-px grid for layout, 4-px for dense controls</p>
</div></body></html>
