<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .group { display:flex; flex-direction:column; gap:6px; }
  .bar { display:flex; height:60px; border-radius:8px; overflow:hidden; }
  .seg { flex:1; display:flex; align-items:flex-end; padding:6px 8px; font-size:10px; font-family:var(--font-mono); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;}
  .dot { width:6px; height:6px; border-radius:50%;}
</style></head>
<body><div class="card">
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
    <div class="group">
      <div class="bar">
        <div class="seg" style="background:var(--success-100); color:var(--success-700);">100</div>
        <div class="seg" style="background:var(--success-500); color:#fff;">500</div>
        <div class="seg" style="background:var(--success-700); color:#fff;">700</div>
      </div>
      <span class="pill" style="background:var(--success-050); color:var(--success-700);"><span class="dot" style="background:var(--success-500);"></span>Completed</span>
    </div>
    <div class="group">
      <div class="bar">
        <div class="seg" style="background:var(--warning-100); color:var(--warning-700);">100</div>
        <div class="seg" style="background:var(--warning-500); color:#fff;">500</div>
        <div class="seg" style="background:var(--warning-700); color:#fff;">700</div>
      </div>
      <span class="pill" style="background:var(--warning-050); color:var(--warning-700);"><span class="dot" style="background:var(--warning-500);"></span>At risk</span>
    </div>
    <div class="group">
      <div class="bar">
        <div class="seg" style="background:var(--danger-100); color:var(--danger-700);">100</div>
        <div class="seg" style="background:var(--danger-500); color:#fff;">500</div>
        <div class="seg" style="background:var(--danger-700); color:#fff;">700</div>
      </div>
      <span class="pill" style="background:var(--danger-050); color:var(--danger-700);"><span class="dot" style="background:var(--danger-500);"></span>Blocked</span>
    </div>
    <div class="group">
      <div class="bar">
        <div class="seg" style="background:var(--info-100); color:var(--info-700);">100</div>
        <div class="seg" style="background:var(--info-500); color:#fff;">500</div>
        <div class="seg" style="background:var(--info-700); color:#fff;">700</div>
      </div>
      <span class="pill" style="background:var(--info-050); color:var(--info-700);"><span class="dot" style="background:var(--info-500);"></span>In review</span>
    </div>
  </div>
</div></body></html>
