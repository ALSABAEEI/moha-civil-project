<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .grid{ display:grid; grid-template-columns: repeat(10, 1fr); gap:14px;}
  .ic{ display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink-700);}
  .ic svg{ width:22px; height:22px; stroke:currentColor; stroke-width:1.75; fill:none;}
  .ic span{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-500); text-align:center; line-height:1.2;}
  .sz{ display:flex; gap:18px; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--border-1);}
  .sz .ex{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--teal-600);}
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>dashboard</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h5l2 2h9v11a2 2 0 0 1-2 2H4z" stroke-linejoin="round"/></svg><span>folder</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3" stroke-linecap="round"/></svg><span>tasks</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke-linejoin="round"/></svg><span>vendor</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>engineer</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>wallet</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 17V7m6 10V11m6 6V5m6 12V9"/></svg><span>bar-chart</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v4M4.93 4.93l2.83 2.83M2 12h4M4.93 19.07l2.83-2.83M12 18v4M19.07 19.07l-2.83-2.83M18 12h4M19.07 4.93 16.24 7.76"/><circle cx="12" cy="12" r="3"/></svg><span>settings</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0v5l2 4H4l2-4z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span>bell</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>search</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" stroke-linecap="round"/></svg><span>plus</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"/></svg><span>minus</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>check</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" stroke-linecap="round"/></svg><span>x</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><span>clock</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg><span>calendar</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M14 3h-4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M9 3 7.5 1.5h-3v3L6 6M19 6l-1.5-1.5v-3h-3L13 3"/></svg><span>hard-hat</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>file</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>chevron-d</span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg><span>alert</span></div>
  </div>
  <div class="sz">
    <div class="ex"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="token-label">14</span></div>
    <div class="ex"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="token-label">16</span></div>
    <div class="ex"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.75" fill="none"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="token-label">20</span></div>
    <div class="ex"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.75" fill="none"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="token-label">24</span></div>
    <div class="ex"><svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.75" fill="none"><path d="M5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="token-label">32</span></div>
    <p class="meta" style="margin-left:auto;">Lucide · stroke 1.75 (2 under 16px) · currentColor</p>
  </div>
</div></body></html>
