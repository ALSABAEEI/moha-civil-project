<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_card.css"/>
<style>.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:var(--font-sans)}
.d{width:6px;height:6px;border-radius:50%}</style>
</head>
<body><div class="card row" style="gap:10px">
  <span class="chip" style="background:var(--teal-050);color:var(--teal-700)"><span class="d" style="background:var(--teal-500)"></span>قيد التنفيذ</span>
  <span class="chip" style="background:var(--info-050);color:var(--info-700)"><span class="d" style="background:var(--info-500)"></span>قيد المراجعة</span>
  <span class="chip" style="background:var(--warning-050);color:var(--warning-700)"><span class="d" style="background:var(--warning-500)"></span>في خطر</span>
  <span class="chip" style="background:var(--danger-050);color:var(--danger-700)"><span class="d" style="background:var(--danger-500)"></span>متوقف</span>
  <span class="chip" style="background:var(--success-050);color:var(--success-700)"><span class="d" style="background:var(--success-500)"></span>مكتمل</span>
  <span class="chip" style="background:var(--ink-100);color:var(--ink-700)"><span class="d" style="background:var(--ink-500)"></span>لم يبدأ</span>
  <span class="chip" style="background:var(--navy-100);color:var(--navy-800)">معتمَد</span>
</div></body></html>
