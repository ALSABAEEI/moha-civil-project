<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .es{ background:#fff; border:1px dashed var(--border-2); border-radius:14px; padding:28px 24px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; position:relative; overflow:hidden;}
  .es::before{ content:""; position:absolute; right:-30px; bottom:-30px; width:180px; height:180px; background:url('../assets/logo-icon.svg') no-repeat center/contain; opacity:.05;}
  .es .ic{ width:36px; height:36px; color:var(--navy-700); opacity:.7;}
  .es h4{ font-size:15px; font-weight:600; color:var(--ink-900); margin:0;}
  .es p{ font-size:13px; color:var(--ink-500); margin:0; max-width:360px; line-height:1.5;}
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; background:var(--navy-800); color:#fff; font-size:13px; font-weight:600; border:none; cursor:pointer; margin-top:4px;}
</style></head>
<body><div class="card" style="background:var(--canvas);">
  <div class="es">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z"/></svg>
    <h4>No vendors assigned yet</h4>
    <p>Add a vendor to track deliverables, invoices, and payment status against this project.</p>
    <button class="btn">Assign vendor</button>
  </div>
</div></body></html>
